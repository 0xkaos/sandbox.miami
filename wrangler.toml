name = "sandbox"
main = "worker.js"
compatibility_date = "2024-01-01"

[[routes]]
pattern = "sandbox.miami"
zone_name = "sandbox.miami"
custom_domain = true

[assets]
directory = "public"

[[durable_objects.bindings]]
name = "STYLUS_SESSIONS"
class_name = "StylusSession"

[[migrations]]
tag = "v1"
new_classes = ["StylusSession"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sandbox-miami-storage"
preview_bucket_name = "sandbox-miami-storage-preview"

[[d1_databases]]
binding = "NOTES_DB"
database_name = "sandbox-notes"
database_id = "05a58bbb-3956-4d08-9cd6-8100fc8e0d9a"
