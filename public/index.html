<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101113">
    <meta name="description" content="A collection of browser experiments, newest first.">
    <title>Sandbox Miami</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #d9dadd;
            background: #101113;
            font-synthesis: none;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        main { max-width: 848px; margin: 0 auto; padding: 64px 32px 80px; }
        h1 { margin: 0 0 36px; color: #f0f0f1; font-size: 22px; font-weight: 500; letter-spacing: -0.6px; }
        ul { margin: 0; padding: 0; list-style: none; }
        li { border-bottom: 1px solid #25272b; }
        li:first-child { border-top: 1px solid #25272b; }
        a { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 18px 0; color: inherit; text-decoration: none; line-height: 1.5; }
        .title { min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
        time { flex-shrink: 0; color: #858a94; font-size: 12px; font-variant-numeric: tabular-nums; }
        a:hover .title { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
        a:focus-visible { outline: 2px solid #b8c4d7; outline-offset: 5px; border-radius: 2px; }
        #message, noscript { color: #a0a5ae; font-size: 14px; line-height: 1.6; }
        @media (max-width: 540px) {
            main { padding: 36px 22px 56px; }
            h1 { margin-bottom: 28px; font-size: 20px; }
            a { gap: 16px; padding: 16px 0; }
            .title { font-size: 15px; }
            time { font-size: 11px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Sandbox Miami</h1>
        <ul id="demos" role="list" aria-label="Experiments, newest first" aria-busy="true"></ul>
        <p id="message" role="status" hidden></p>
        <noscript>Enable JavaScript to view the experiments.</noscript>
    </main>
    <script>
        const list = document.getElementById('demos');
        const message = document.getElementById('message');
        const dateFormat = new Intl.DateTimeFormat('en', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
        const timestamp = demo => Date.parse(demo.createdAt) || 0;

        async function loadDemos() {
            try {
                const response = await fetch('/manifest.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Manifest unavailable');
                const manifest = await response.json();
                if (!Array.isArray(manifest)) throw new Error('Invalid manifest');
                const demos = manifest.filter(demo => demo && typeof demo.title === 'string'
                    && typeof demo.path === 'string' && demo.path.startsWith('/') && !demo.path.startsWith('//'));
                demos.sort((a, b) => timestamp(b) - timestamp(a) || a.title.localeCompare(b.title, 'en') || a.path.localeCompare(b.path, 'en'));
                const items = document.createDocumentFragment();
                for (const demo of demos) {
                    const item = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = demo.path;
                    const title = document.createElement('span');
                    title.className = 'title';
                    title.textContent = demo.title;
                    link.append(title);
                    if (Number.isFinite(Date.parse(demo.createdAt))) {
                        const date = document.createElement('time');
                        date.dateTime = demo.createdAt;
                        date.textContent = dateFormat.format(new Date(demo.createdAt));
                        link.append(date);
                    }
                    item.append(link);
                    items.append(item);
                }
                list.replaceChildren(items);
                if (!demos.length) {
                    message.textContent = 'No experiments yet.';
                    message.hidden = false;
                }
            } catch {
                message.textContent = 'Could not load the experiments. Reload to try again.';
                message.hidden = false;
            } finally {
                list.setAttribute('aria-busy', 'false');
            }
        }
        loadDemos();
    </script>
</body>
</html>
