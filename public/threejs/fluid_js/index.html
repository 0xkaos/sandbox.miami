<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluid JS Playground</title>
  <meta name="description" content="Interactive fluid simulation sketch powered by Fluid-JS with adjustable behavior controls." />
  <script src="https://cdn.jsdelivr.net/npm/fluid-canvas@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --ink: #f3f8ff;
      --panel: rgba(6, 11, 20, 0.72);
      --border: rgba(255, 255, 255, 0.22);
      --accent: #67e0ff;
      --accent2: #ff8b5e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04070e;
      color: var(--ink);
      font-family: 'Sora', sans-serif;
    }

    #fluidCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    .hud {
      position: fixed;
      z-index: 2;
      top: 1rem;
      left: 1rem;
      width: min(360px, calc(100vw - 2rem));
      padding: 0.95rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .title {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .sub {
      margin: 0.3rem 0 0.75rem;
      opacity: 0.85;
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .row label {
      font-size: 0.75rem;
      letter-spacing: 0.03em;
      opacity: 0.9;
    }

    .val {
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.76rem;
      opacity: 0.95;
    }

    input[type='range'] {
      width: 100%;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      outline: none;
    }

    .inline-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.7rem;
      font-size: 0.76rem;
      opacity: 0.95;
    }

    .inline-toggle input {
      width: 18px;
      height: 18px;
    }

    .btns {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      font-size: 0.74rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
    }

    .note {
      margin-top: 0.65rem;
      font-size: 0.7rem;
      opacity: 0.72;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <canvas id="fluidCanvas"></canvas>

  <section class="hud">
    <h1 class="title">Fluid JS Playground</h1>
    <p class="sub">Drag on desktop or touch on mobile to inject flow. Tuned for your sandbox and inspired by Fluid-JS.</p>

    <div class="row">
      <label for="curl">Vorticity</label>
      <span class="val" id="curlVal">18</span>
    </div>
    <input id="curl" type="range" min="0" max="50" step="1" value="18" />

    <div class="row">
      <label for="dissipation">Dissipation</label>
      <span class="val" id="dissipationVal">0.97</span>
    </div>
    <input id="dissipation" type="range" min="0.90" max="1.00" step="0.005" value="0.97" />

    <div class="row">
      <label for="radius">Emitter Size</label>
      <span class="val" id="radiusVal">0.42</span>
    </div>
    <input id="radius" type="range" min="0.20" max="0.90" step="0.01" value="0.42" />

    <div class="row">
      <label for="gravity">Emitter Gravity</label>
      <span class="val" id="gravityVal">0.24</span>
    </div>
    <input id="gravity" type="range" min="0.05" max="0.80" step="0.01" value="0.24" />

    <div class="inline-toggle">
      <label for="emittersToggle">Enable Orbital Emitters</label>
      <input id="emittersToggle" type="checkbox" checked />
    </div>

    <div class="btns">
      <button id="randomize">Random Palette</button>
      <button id="reset">Reset Fluid</button>
    </div>

    <p class="note">Source library: <code>fluid-canvas</code> from the Fluid-JS project. This page uses CDN runtime rather than vendoring repo code.</p>
  </section>

  <script>
    const canvas = document.getElementById('fluidCanvas');
    const fluid = new Fluid(canvas);

    const params = {
      sim_resolution: 128,
      dye_resolution: 768,
      dissipation: 0.97,
      velocity: 0.99,
      pressure: 0.82,
      pressure_iteration: 20,
      curl: 18,
      emitter_size: 0.42,
      render_shaders: true,
      multi_color: true,
      render_bloom: false,
      transparent: false,
      background_color: { r: 3, g: 6, b: 10 }
    };

    fluid.mapBehaviors(params);
    fluid.activate();

    const paletteState = {
      hue: 0,
      sat: 1,
      contrast: 1
    };

    function hslToRgb01(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const hh = h / 60;
      const x = c * (1 - Math.abs((hh % 2) - 1));
      let r = 0;
      let g = 0;
      let b = 0;

      if (hh >= 0 && hh < 1) [r, g, b] = [c, x, 0];
      else if (hh < 2) [r, g, b] = [x, c, 0];
      else if (hh < 3) [r, g, b] = [0, c, x];
      else if (hh < 4) [r, g, b] = [0, x, c];
      else if (hh < 5) [r, g, b] = [x, 0, c];
      else [r, g, b] = [c, 0, x];

      const m = l - c / 2;
      return [r + m, g + m, b + m];
    }

    function applyPalette() {
      canvas.style.filter = `hue-rotate(${paletteState.hue}deg) saturate(${paletteState.sat.toFixed(2)}) contrast(${paletteState.contrast.toFixed(2)})`;
    }

    applyPalette();

    let applyTimer = null;

    function applyFluidParams() {
      // Re-map into the runtime config and reset so shader/FBO state picks up changes.
      fluid.mapBehaviors({ ...fluid.PARAMS });
      fluid.reset();
    }

    function scheduleApply(delayMs = 80) {
      if (applyTimer) {
        clearTimeout(applyTimer);
      }
      applyTimer = setTimeout(() => {
        applyTimer = null;
        applyFluidParams();
      }, delayMs);
    }

    function wireRange(id, key, formatter = (v) => v) {
      const input = document.getElementById(id);
      const label = document.getElementById(id + 'Val');

      const update = () => {
        const value = Number(input.value);
        fluid.PARAMS[key] = value;
        label.textContent = formatter(value);
      };

      input.addEventListener('input', () => {
        update();
        scheduleApply();
      });
      input.addEventListener('change', () => {
        update();
        applyFluidParams();
      });
      update();
    }

    wireRange('curl', 'curl', (v) => String(v));
    wireRange('dissipation', 'dissipation', (v) => v.toFixed(3));
    wireRange('radius', 'emitter_size', (v) => v.toFixed(2));

    let gravityStrength = 0.24;
    const gravityInput = document.getElementById('gravity');
    const gravityVal = document.getElementById('gravityVal');
    gravityInput.addEventListener('input', () => {
      gravityStrength = Number(gravityInput.value);
      gravityVal.textContent = gravityStrength.toFixed(2);
    });
    gravityStrength = Number(gravityInput.value);
    gravityVal.textContent = gravityStrength.toFixed(2);

    let showEmitters = true;
    const emittersToggle = document.getElementById('emittersToggle');
    emittersToggle.addEventListener('change', () => {
      showEmitters = emittersToggle.checked;
    });

    document.getElementById('randomize').addEventListener('click', () => {
      const hue = Math.floor(Math.random() * 360);
      paletteState.hue = hue;
      paletteState.sat = 1.25 + Math.random() * 0.65;
      paletteState.contrast = 1.0 + Math.random() * 0.35;
      applyPalette();

      const baseA = hslToRgb01(hue, 0.84, 0.55);
      const baseB = hslToRgb01((hue + 45) % 360, 0.92, 0.62);
      fluid.PARAMS.multi_color = false;
      fluid.PARAMS.fluid_color = [baseA, baseB];
      applyFluidParams();
    });

    document.getElementById('reset').addEventListener('click', () => {
      fluid.mapBehaviors({ ...fluid.PARAMS });
      fluid.reset();
    });

    const emitters = [
      { x: 0.33, y: 0.42, vx: 0.020, vy: -0.013, mass: 1.0 },
      { x: 0.67, y: 0.58, vx: -0.018, vy: 0.011, mass: 1.2 }
    ];

    const mouseBody = {
      x: 0.5,
      y: 0.5,
      mass: 2.4,
      active: false
    };

    const virtualPointerIds = [101, 102, 103];
    const pointerSlots = {
      emitterA: 1,
      emitterB: 2,
      mouseField: 3
    };

    function makeVirtualPointer() {
      return {
        id: -1,
        x: 0,
        y: 0,
        dx: 0,
        dy: 0,
        down: false,
        moved: false,
        color: { r: 0.06, g: 0.45, b: 0.95 }
      };
    }

    function ensureVirtualPointers() {
      if (!Array.isArray(fluid.pointers)) {
        return false;
      }

      // Slot 0 is managed by fluid-canvas mouse listeners; reserve it.
      while (fluid.pointers.length < 4) {
        fluid.pointers.push(makeVirtualPointer());
      }

      return true;
    }

    function updateVirtualPointer(slot, normX, normY, isDown, velocityGain = 1) {
      if (!ensureVirtualPointers()) {
        return;
      }

      const p = fluid.pointers[slot];
      const x = normX * canvas.clientWidth;
      const y = normY * canvas.clientHeight;

      p.id = virtualPointerIds[slot];
      const dx = x - p.x;
      const dy = y - p.y;
      p.dx = dx * velocityGain;
      p.dy = dy * velocityGain;
      p.x = x;
      p.y = y;
      p.down = isDown;
      p.moved = isDown && (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01);
    }

    function applyGravity(a, b, dt) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distSq = dx * dx + dy * dy + 0.0025;
      const dist = Math.sqrt(distSq);
      const invDist = 1 / dist;
      const force = gravityStrength * (a.mass * b.mass) / distSq;
      const ax = dx * invDist * force;
      const ay = dy * invDist * force;

      a.vx += ax * dt;
      a.vy += ay * dt;
      b.vx -= ax * dt;
      b.vy -= ay * dt;
    }

    function applyMouseGravity(p, dt) {
      if (!mouseBody.active) {
        return;
      }

      const dx = mouseBody.x - p.x;
      const dy = mouseBody.y - p.y;
      const distSq = dx * dx + dy * dy + 0.0012;
      const dist = Math.sqrt(distSq);
      const invDist = 1 / dist;
      const force = gravityStrength * (p.mass * mouseBody.mass) / distSq;

      p.vx += dx * invDist * force * dt;
      p.vy += dy * invDist * force * dt;
    }

    function stepEmitters(dt) {
      applyGravity(emitters[0], emitters[1], dt);
      applyMouseGravity(emitters[0], dt);
      applyMouseGravity(emitters[1], dt);

      for (const p of emitters) {
        p.vx *= 0.992;
        p.vy *= 0.992;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.x < 0.02 || p.x > 0.98) {
          p.vx *= -0.92;
          p.x = Math.max(0.02, Math.min(0.98, p.x));
        }
        if (p.y < 0.02 || p.y > 0.98) {
          p.vy *= -0.92;
          p.y = Math.max(0.02, Math.min(0.98, p.y));
        }
      }
    }

    let prevTime = performance.now();
    function animateEmitters(now) {
      const dt = Math.min((now - prevTime) / 1000, 0.035);
      prevTime = now;

      if (showEmitters) {
        stepEmitters(dt);
        updateVirtualPointer(pointerSlots.emitterA, emitters[0].x, emitters[0].y, true, 24);
        updateVirtualPointer(pointerSlots.emitterB, emitters[1].x, emitters[1].y, true, 24);
      } else {
        updateVirtualPointer(pointerSlots.emitterA, emitters[0].x, emitters[0].y, false);
        updateVirtualPointer(pointerSlots.emitterB, emitters[1].x, emitters[1].y, false);
      }

      updateVirtualPointer(pointerSlots.mouseField, mouseBody.x, mouseBody.y, mouseBody.active, 5);
      requestAnimationFrame(animateEmitters);
    }

    window.addEventListener('pointermove', (event) => {
      mouseBody.x = event.clientX / window.innerWidth;
      mouseBody.y = event.clientY / window.innerHeight;
    });
    window.addEventListener('pointerdown', (event) => {
      mouseBody.active = true;
      mouseBody.x = event.clientX / window.innerWidth;
      mouseBody.y = event.clientY / window.innerHeight;
    });
    window.addEventListener('pointerup', () => {
      mouseBody.active = false;
    });
    window.addEventListener('pointercancel', () => {
      mouseBody.active = false;
    });

    window.addEventListener('resize', () => {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      fluid.reset();
    });

    ensureVirtualPointers();
    requestAnimationFrame(animateEmitters);
  </script>
</body>
</html>
