<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="High-quality fractal explorer with deep zoom, Julia and Mandelbrot variants, smooth coloring, and live controls.">
    <title>Fractal Explorer Lab</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(130, 180, 255, 0.16), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(250, 180, 170, 0.14), transparent 42%),
                #07090f;
            color: #ecf2ff;
        }

        #app {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            touch-action: none;
            background: #010104;
        }

        .hud {
            position: fixed;
            left: 14px;
            top: 14px;
            width: min(420px, calc(100vw - 28px));
            z-index: 10;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(6, 9, 16, 0.7);
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .hud h1 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .hud p {
            margin: 8px 0 0;
            font-size: 0.79rem;
            color: rgba(236, 242, 255, 0.82);
            line-height: 1.4;
        }

        .hud small {
            display: block;
            margin-top: 8px;
            color: rgba(236, 242, 255, 0.65);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }

        .toggle {
            position: fixed;
            right: 14px;
            top: 14px;
            z-index: 11;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(10, 14, 24, 0.7);
            color: #ecf2ff;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .toggle:hover {
            background: rgba(18, 24, 38, 0.88);
        }

        @media (max-width: 780px) {
            .hud {
                top: auto;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                left: 12px;
                width: calc(100vw - 24px);
            }

            .toggle {
                top: 10px;
                right: 10px;
            }

            canvas {
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <aside class="hud" id="hud">
        <h1>Fractal Explorer Lab</h1>
        <p>Continuous deep zoom with high-precision recalc, multiple fractal formulas, and live controls. Click to redirect center while autoplay keeps diving.</p>
        <small>Render window capped at 1280x1024. Pan is disabled by design for stable deep zoom.</small>
    </aside>
    <button class="toggle" id="toggle-hud" type="button">Hide HUD</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const MAX_RENDER_W = 1280;
        const MAX_RENDER_H = 1024;
        const LOG2_10 = Math.log2(10);

        const app = document.getElementById('app');
        const hud = document.getElementById('hud');
        const toggleHudButton = document.getElementById('toggle-hud');

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        app.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        function splitDouble(value) {
            const hi = Math.fround(value);
            return [hi, value - hi];
        }

        function parseHexColor(hex) {
            const normalized = hex.startsWith('#') ? hex.slice(1) : hex;
            const value = parseInt(normalized, 16);
            return [
                ((value >> 16) & 255) / 255,
                ((value >> 8) & 255) / 255,
                (value & 255) / 255
            ];
        }

        const fractalIds = {
            Mandelbrot: 0,
            Julia: 1,
            'Burning Ship': 2,
            Tricorn: 3,
            Multibrot: 4
        };

        const presets = {
            Mandelbrot: { centerX: -0.743643887037151, centerY: 0.13182590420533, log2Scale: Math.log2(2.9), juliaCx: -0.8, juliaCy: 0.156 },
            Julia: { centerX: 0.0, centerY: 0.0, log2Scale: Math.log2(1.9), juliaCx: -0.8, juliaCy: 0.156 },
            'Burning Ship': { centerX: -1.76005, centerY: -0.025, log2Scale: Math.log2(0.95), juliaCx: -0.8, juliaCy: 0.156 },
            Tricorn: { centerX: -0.1, centerY: 0.0, log2Scale: Math.log2(2.2), juliaCx: -0.8, juliaCy: 0.156 },
            Multibrot: { centerX: 0.0, centerY: 0.0, log2Scale: Math.log2(2.2), juliaCx: -0.8, juliaCy: 0.156 }
        };

        const params = {
            fractal: 'Mandelbrot',
            autoplay: true,
            zoomSpeed: 0.38,
            centerX: presets.Mandelbrot.centerX,
            centerY: presets.Mandelbrot.centerY,
            log2Scale: presets.Mandelbrot.log2Scale,
            displayScale: '2.9e+0',
            zoomDepth: '0.00x',
            maxIterations: 700,
            escapeRadius: 96.0,
            power: 2.0,
            juliaCx: presets.Mandelbrot.juliaCx,
            juliaCy: presets.Mandelbrot.juliaCy,
            palette: 'Aurora',
            paletteDensity: 3.2,
            paletteCycle: 0.5,
            exposure: 1.05,
            interiorColor: '#07090f',
            redirectCenter() {
                params.centerX = params.pendingCenterX;
                params.centerY = params.pendingCenterY;
                syncUniforms();
                syncDisplay();
            },
            pendingCenterX: presets.Mandelbrot.centerX,
            pendingCenterY: presets.Mandelbrot.centerY,
            resetView() {
                applyPreset(params.fractal, true);
                params.zoomSpeed = 0.38;
                syncUniforms();
                syncDisplay();
            }
        };

        const paletteIds = {
            Aurora: 0,
            Coral: 1,
            Mint: 2,
            Ice: 3,
            Dusk: 4
        };

        const uniforms = {
            uResolution: { value: new THREE.Vector2(1, 1) },
            uCenterX: { value: new THREE.Vector2(0, 0) },
            uCenterY: { value: new THREE.Vector2(0, 0) },
            uScaleDS: { value: new THREE.Vector2(0, 0) },
            uLog2Scale: { value: params.log2Scale },
            uMaxIterations: { value: params.maxIterations },
            uEscapeRadius: { value: params.escapeRadius },
            uFractalType: { value: fractalIds[params.fractal] },
            uPower: { value: params.power },
            uJuliaC: { value: new THREE.Vector2(params.juliaCx, params.juliaCy) },
            uInteriorColor: { value: new THREE.Vector3(...parseHexColor(params.interiorColor)) },
            uPaletteId: { value: paletteIds[params.palette] },
            uPaletteDensity: { value: params.paletteDensity },
            uPaletteShift: { value: 0.0 },
            uExposure: { value: params.exposure }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;

                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;

                uniform vec2 uResolution;
                uniform vec2 uCenterX;
                uniform vec2 uCenterY;
                uniform vec2 uScaleDS;
                uniform float uLog2Scale;
                uniform int uMaxIterations;
                uniform float uEscapeRadius;
                uniform int uFractalType;
                uniform float uPower;
                uniform vec2 uJuliaC;
                uniform vec3 uInteriorColor;
                uniform int uPaletteId;
                uniform float uPaletteDensity;
                uniform float uPaletteShift;
                uniform float uExposure;

                vec2 quickTwoSum(float a, float b) {
                    float s = a + b;
                    return vec2(s, b - (s - a));
                }

                vec2 twoSum(float a, float b) {
                    float s = a + b;
                    float bb = s - a;
                    float err = (a - (s - bb)) + (b - bb);
                    return vec2(s, err);
                }

                vec2 split(float a) {
                    const float c = 4097.0;
                    float t = c * a;
                    float hi = t - (t - a);
                    float lo = a - hi;
                    return vec2(hi, lo);
                }

                vec2 twoProd(float a, float b) {
                    float p = a * b;
                    vec2 sa = split(a);
                    vec2 sb = split(b);
                    float err = ((sa.x * sb.x - p) + sa.x * sb.y + sa.y * sb.x) + sa.y * sb.y;
                    return vec2(p, err);
                }

                vec2 dsAdd(vec2 a, vec2 b) {
                    vec2 s = twoSum(a.x, b.x);
                    return quickTwoSum(s.x, s.y + a.y + b.y);
                }

                vec2 dsSub(vec2 a, vec2 b) {
                    vec2 s = twoSum(a.x, -b.x);
                    return quickTwoSum(s.x, s.y + a.y - b.y);
                }

                vec2 dsMul(vec2 a, vec2 b) {
                    vec2 p = twoProd(a.x, b.x);
                    return quickTwoSum(p.x, p.y + a.x * b.y + a.y * b.x);
                }

                vec2 dsMulFloat(vec2 a, float b) {
                    vec2 p = twoProd(a.x, b);
                    return quickTwoSum(p.x, p.y + a.y * b);
                }

                float dsToFloat(vec2 a) {
                    return a.x + a.y;
                }

                vec3 paletteColor(float t, int paletteId) {
                    float a = fract(t);
                    vec3 c0;
                    vec3 c1;
                    vec3 c2;
                    vec3 c3;

                    if (paletteId == 0) {
                        c0 = vec3(0.93, 0.96, 1.00);
                        c1 = vec3(0.80, 0.93, 1.00);
                        c2 = vec3(0.83, 1.00, 0.94);
                        c3 = vec3(1.00, 0.91, 0.92);
                    } else if (paletteId == 1) {
                        c0 = vec3(1.00, 0.94, 0.89);
                        c1 = vec3(1.00, 0.84, 0.82);
                        c2 = vec3(1.00, 0.91, 0.76);
                        c3 = vec3(0.98, 0.83, 0.95);
                    } else if (paletteId == 2) {
                        c0 = vec3(0.90, 1.00, 0.95);
                        c1 = vec3(0.83, 0.99, 0.91);
                        c2 = vec3(0.86, 0.95, 1.00);
                        c3 = vec3(0.96, 1.00, 0.88);
                    } else if (paletteId == 3) {
                        c0 = vec3(0.92, 0.97, 1.00);
                        c1 = vec3(0.78, 0.89, 1.00);
                        c2 = vec3(0.90, 0.96, 1.00);
                        c3 = vec3(0.98, 1.00, 1.00);
                    } else {
                        c0 = vec3(0.95, 0.92, 1.00);
                        c1 = vec3(0.88, 0.86, 1.00);
                        c2 = vec3(0.93, 0.91, 0.98);
                        c3 = vec3(1.00, 0.88, 0.94);
                    }

                    float x = a * 3.0;
                    if (x < 1.0) return mix(c0, c1, x);
                    if (x < 2.0) return mix(c1, c2, x - 1.0);
                    return mix(c2, c3, x - 2.0);
                }

                vec2 cmul(vec2 a, vec2 b) {
                    return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x);
                }

                vec2 cpow(vec2 z, float p) {
                    float r = length(z);
                    if (r < 1e-20) {
                        return vec2(0.0);
                    }
                    float theta = atan(z.y, z.x);
                    float rp = pow(r, p);
                    float t = theta * p;
                    return vec2(rp * cos(t), rp * sin(t));
                }

                vec3 toneMap(vec3 c, float exposure) {
                    c = vec3(1.0) - exp(-c * exposure);
                    return pow(c, vec3(0.95));
                }

                void main() {
                    vec2 uv = (gl_FragCoord.xy / uResolution.xy) * 2.0 - 1.0;
                    uv.x *= uResolution.x / uResolution.y;

                    vec2 cx = dsAdd(uCenterX, dsMulFloat(uScaleDS, uv.x));
                    vec2 cy = dsAdd(uCenterY, dsMulFloat(uScaleDS, uv.y));
                    vec2 c = vec2(dsToFloat(cx), dsToFloat(cy));

                    vec2 zx = vec2(0.0);
                    vec2 zy = vec2(0.0);
                    if (uFractalType == 1) {
                        zx = cx;
                        zy = cy;
                        c = uJuliaC;
                    }

                    float esc2 = uEscapeRadius * uEscapeRadius;
                    float smoothIter = 0.0;
                    int i;

                    for (i = 0; i < 3600; i++) {
                        if (i >= uMaxIterations) {
                            break;
                        }

                        if (uFractalType == 0 || uFractalType == 1) {
                            vec2 zx2 = dsMul(zx, zx);
                            vec2 zy2 = dsMul(zy, zy);
                            vec2 newX = dsAdd(dsSub(zx2, zy2), vec2(c.x, 0.0));
                            vec2 newY = dsAdd(dsMulFloat(dsMul(zx, zy), 2.0), vec2(c.y, 0.0));
                            zx = newX;
                            zy = newY;
                        } else if (uFractalType == 2) {
                            vec2 azx = vec2(abs(dsToFloat(zx)), 0.0);
                            vec2 azy = vec2(abs(dsToFloat(zy)), 0.0);
                            vec2 zx2 = dsMul(azx, azx);
                            vec2 zy2 = dsMul(azy, azy);
                            vec2 newX = dsAdd(dsSub(zx2, zy2), vec2(c.x, 0.0));
                            vec2 newY = dsAdd(dsMulFloat(dsMul(azx, azy), 2.0), vec2(c.y, 0.0));
                            zx = newX;
                            zy = newY;
                        } else {
                            vec2 zf = vec2(dsToFloat(zx), dsToFloat(zy));
                            vec2 nz;
                            if (uFractalType == 3) {
                                vec2 conjZ = vec2(zf.x, -zf.y);
                                nz = cmul(conjZ, conjZ) + c;
                            } else {
                                nz = cpow(zf, max(uPower, 2.0)) + c;
                            }
                            zx = vec2(nz.x, 0.0);
                            zy = vec2(nz.y, 0.0);
                        }

                        float zxf = dsToFloat(zx);
                        float zyf = dsToFloat(zy);
                        float m2 = zxf * zxf + zyf * zyf;
                        if (m2 > esc2) {
                            float m = sqrt(m2);
                            float smoothBase = (uFractalType == 4) ? max(uPower, 2.0) : 2.0;
                            float logZn = log(m);
                            float nu = log(logZn / log(smoothBase)) / log(smoothBase);
                            smoothIter = float(i) + 1.0 - nu;
                            break;
                        }
                    }

                    if (i >= uMaxIterations) {
                        gl_FragColor = vec4(uInteriorColor, 1.0);
                        return;
                    }

                    float t = smoothIter / float(uMaxIterations);
                    float cycle = uPaletteShift + (-uLog2Scale) * 0.15915494;
                    float paletteT = t * uPaletteDensity + cycle;
                    vec3 pale = paletteColor(paletteT, uPaletteId);

                    float shade = pow(clamp(t, 0.0, 1.0), 1.1);
                    vec3 color = mix(uInteriorColor * 0.55, pale, shade);
                    color *= 0.78 + 0.22 * sin(6.28318 * (paletteT + 0.17));

                    gl_FragColor = vec4(toneMap(max(color, 0.0), uExposure), 1.0);
                }
            `
        });

        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quad);

        let renderWidth = 1;
        let renderHeight = 1;
        const clock = new THREE.Clock();

        function updateRenderSize() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const scale = Math.min(1, vw / MAX_RENDER_W, vh / MAX_RENDER_H);

            renderWidth = Math.max(320, Math.floor(MAX_RENDER_W * scale));
            renderHeight = Math.max(240, Math.floor(MAX_RENDER_H * scale));

            renderer.setSize(renderWidth, renderHeight, false);
            renderer.domElement.style.width = `${renderWidth}px`;
            renderer.domElement.style.height = `${renderHeight}px`;
            uniforms.uResolution.value.set(renderWidth, renderHeight);
        }

        function getScaleFromLog2() {
            return Math.pow(2, params.log2Scale);
        }

        function applyPreset(fractalName, preserveZoom = false) {
            const preset = presets[fractalName] || presets.Mandelbrot;
            params.centerX = preset.centerX;
            params.centerY = preset.centerY;
            params.pendingCenterX = preset.centerX;
            params.pendingCenterY = preset.centerY;
            params.juliaCx = preset.juliaCx;
            params.juliaCy = preset.juliaCy;
            if (!preserveZoom) {
                params.log2Scale = preset.log2Scale;
            }
        }

        function syncUniforms() {
            const [cxHi, cxLo] = splitDouble(params.centerX);
            const [cyHi, cyLo] = splitDouble(params.centerY);
            const scale = getScaleFromLog2();
            const [sHi, sLo] = splitDouble(scale);
            const interiorColor = parseHexColor(params.interiorColor);

            uniforms.uCenterX.value.set(cxHi, cxLo);
            uniforms.uCenterY.value.set(cyHi, cyLo);
            uniforms.uScaleDS.value.set(sHi, sLo);
            uniforms.uLog2Scale.value = params.log2Scale;
            uniforms.uMaxIterations.value = params.maxIterations;
            uniforms.uEscapeRadius.value = params.escapeRadius;
            uniforms.uFractalType.value = fractalIds[params.fractal];
            uniforms.uPower.value = params.power;
            uniforms.uJuliaC.value.set(params.juliaCx, params.juliaCy);
            uniforms.uInteriorColor.value.set(interiorColor[0], interiorColor[1], interiorColor[2]);
            uniforms.uPaletteId.value = paletteIds[params.palette];
            uniforms.uPaletteDensity.value = params.paletteDensity;
            uniforms.uExposure.value = params.exposure;

            params.displayScale = scale.toExponential(3);
            params.zoomDepth = `${Math.max(0, -params.log2Scale / LOG2_10).toFixed(2)}x`;
        }

        function syncDisplay() {
            fractalFolder.controllers.forEach((controller) => controller.updateDisplay());
            centerFolder.controllers.forEach((controller) => controller.updateDisplay());
            viewFolder.controllers.forEach((controller) => controller.updateDisplay());
            colorFolder.controllers.forEach((controller) => controller.updateDisplay());
            infoFolder.controllers.forEach((controller) => controller.updateDisplay());
        }

        function redirectToPixel(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            const nx = (clientX - rect.left) / rect.width;
            const ny = (clientY - rect.top) / rect.height;
            const scale = getScaleFromLog2();
            const aspect = renderWidth / renderHeight;
            const ox = (nx * 2.0 - 1.0) * scale * aspect;
            const oy = (1.0 - ny * 2.0) * scale;

            params.centerX += ox;
            params.centerY += oy;
            params.pendingCenterX = params.centerX;
            params.pendingCenterY = params.centerY;
            syncUniforms();
            syncDisplay();
        }

        renderer.domElement.addEventListener('click', (event) => {
            redirectToPixel(event.clientX, event.clientY);
        });

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            const wheel = Math.sign(event.deltaY);
            params.log2Scale += wheel > 0 ? 0.25 : -0.25;
            syncUniforms();
            syncDisplay();
        }, { passive: false });

        const gui = new GUI({ title: 'Fractal Controls', width: 350 });
        const fractalFolder = gui.addFolder('Fractal');
        const viewFolder = gui.addFolder('Zoom');
        const centerFolder = gui.addFolder('Center Redirect');
        const colorFolder = gui.addFolder('Color');
        const infoFolder = gui.addFolder('Status');

        fractalFolder.add(params, 'fractal', Object.keys(fractalIds)).name('Type').onChange((value) => {
            applyPreset(value);
            syncUniforms();
            syncDisplay();
        });
        fractalFolder.add(params, 'power', 2.0, 8.0, 0.05).name('Power').onChange(syncUniforms);
        fractalFolder.add(params, 'juliaCx', -1.5, 1.5, 0.0001).name('Julia Cx').onChange(syncUniforms);
        fractalFolder.add(params, 'juliaCy', -1.5, 1.5, 0.0001).name('Julia Cy').onChange(syncUniforms);

        viewFolder.add(params, 'autoplay').name('Autoplay Zoom');
        viewFolder.add(params, 'zoomSpeed', 0.0, 2.0, 0.01).name('Zoom Speed');
        viewFolder.add(params, 'log2Scale', -260.0, 3.0, 0.01).name('Log2 Scale').onChange(syncUniforms);
        viewFolder.add(params, 'maxIterations', 64, 3000, 1).name('Iterations').onChange(syncUniforms);
        viewFolder.add(params, 'escapeRadius', 8.0, 512.0, 1.0).name('Escape Radius').onChange(syncUniforms);
        viewFolder.add(params, 'resetView').name('Reset View');

        centerFolder.add(params, 'pendingCenterX', -2.5, 1.5, 0.000000000001).name('Target X');
        centerFolder.add(params, 'pendingCenterY', -1.5, 1.5, 0.000000000001).name('Target Y');
        centerFolder.add(params, 'redirectCenter').name('Redirect');

        colorFolder.add(params, 'palette', Object.keys(paletteIds)).name('Palette').onChange(syncUniforms);
        colorFolder.add(params, 'paletteDensity', 0.2, 12.0, 0.01).name('Palette Density').onChange(syncUniforms);
        colorFolder.add(params, 'paletteCycle', -4.0, 4.0, 0.01).name('Cycle Speed');
        colorFolder.add(params, 'exposure', 0.3, 2.3, 0.01).name('Exposure').onChange(syncUniforms);
        colorFolder.addColor(params, 'interiorColor').name('Interior Color').onChange(syncUniforms);

        infoFolder.add(params, 'displayScale').name('Scale').listen();
        infoFolder.add(params, 'zoomDepth').name('Depth').listen();

        fractalFolder.open();
        viewFolder.open();
        centerFolder.open();
        infoFolder.open();

        function animate() {
            const delta = clock.getDelta();

            if (params.autoplay && params.zoomSpeed > 0) {
                params.log2Scale -= params.zoomSpeed * delta * 1.4;
            }

            uniforms.uPaletteShift.value += delta * params.paletteCycle;
            syncUniforms();
            renderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        toggleHudButton.addEventListener('click', () => {
            const visible = hud.style.display !== 'none';
            hud.style.display = visible ? 'none' : 'block';
            toggleHudButton.textContent = visible ? 'Show HUD' : 'Hide HUD';
        });

        window.addEventListener('resize', updateRenderSize);

        updateRenderSize();
        syncUniforms();
        animate();
    </script>
</body>
</html>
