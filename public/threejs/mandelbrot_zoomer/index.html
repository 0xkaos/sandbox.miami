<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="High-quality Mandelbrot zoomer with smooth coloring, palette cycling, and live controls for center and zoom speed.">
    <title>Mandelbrot Zoomer Lab</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(130, 180, 255, 0.16), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(250, 180, 170, 0.14), transparent 42%),
                #07090f;
            color: #ecf2ff;
        }

        #app {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            touch-action: none;
            background: #010104;
        }

        .hud {
            position: fixed;
            left: 14px;
            top: 14px;
            width: min(420px, calc(100vw - 28px));
            z-index: 10;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(6, 9, 16, 0.7);
            backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .hud h1 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .hud p {
            margin: 8px 0 0;
            font-size: 0.79rem;
            color: rgba(236, 242, 255, 0.82);
            line-height: 1.4;
        }

        .hud small {
            display: block;
            margin-top: 8px;
            color: rgba(236, 242, 255, 0.65);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }

        .toggle {
            position: fixed;
            right: 14px;
            top: 14px;
            z-index: 11;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(10, 14, 24, 0.7);
            color: #ecf2ff;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .toggle:hover {
            background: rgba(18, 24, 38, 0.88);
        }

        @media (max-width: 780px) {
            .hud {
                top: auto;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                left: 12px;
                width: calc(100vw - 24px);
            }

            .toggle {
                top: 10px;
                right: 10px;
            }

            canvas {
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <aside class="hud" id="hud">
        <h1>Mandelbrot Zoomer Lab</h1>
        <p>Scroll to zoom manually, drag to pan center, or let autoplay drive a continuous dive. Color is a pale-to-black gradient that palette-cycles as zoom deepens.</p>
        <small>Render window capped at 1280x1024. Shift + drag pans faster.</small>
    </aside>
    <button class="toggle" id="toggle-hud" type="button">Hide HUD</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        const MAX_RENDER_W = 1280;
        const MAX_RENDER_H = 1024;

        const app = document.getElementById('app');
        const hud = document.getElementById('hud');
        const toggleHudButton = document.getElementById('toggle-hud');

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        app.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const params = {
            autoplay: true,
            zoomSpeed: 0.35,
            centerX: -0.743643887037151,
            centerY: 0.13182590420533,
            scale: 2.9,
            maxIterations: 420,
            escapeRadius: 64.0,
            palette: 'Aurora',
            paletteDensity: 3.2,
            paletteCycle: 0.5,
            exposure: 1.05,
            resetView() {
                params.centerX = -0.743643887037151;
                params.centerY = 0.13182590420533;
                params.scale = 2.9;
                params.zoomSpeed = 0.35;
                syncUniforms();
                syncDisplay();
            }
        };

        const paletteIds = {
            Aurora: 0,
            Coral: 1,
            Mint: 2,
            Ice: 3,
            Dusk: 4
        };

        const uniforms = {
            uResolution: { value: new THREE.Vector2(1, 1) },
            uCenter: { value: new THREE.Vector2(params.centerX, params.centerY) },
            uScale: { value: params.scale },
            uMaxIterations: { value: params.maxIterations },
            uEscapeRadius: { value: params.escapeRadius },
            uPaletteId: { value: paletteIds[params.palette] },
            uPaletteDensity: { value: params.paletteDensity },
            uPaletteShift: { value: 0.0 },
            uExposure: { value: params.exposure }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;

                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;

                varying vec2 vUv;

                uniform vec2 uResolution;
                uniform vec2 uCenter;
                uniform float uScale;
                uniform int uMaxIterations;
                uniform float uEscapeRadius;
                uniform int uPaletteId;
                uniform float uPaletteDensity;
                uniform float uPaletteShift;
                uniform float uExposure;

                vec3 paletteColor(float t, int paletteId) {
                    float a = fract(t);
                    vec3 c0;
                    vec3 c1;
                    vec3 c2;
                    vec3 c3;

                    if (paletteId == 0) {
                        c0 = vec3(0.93, 0.96, 1.00);
                        c1 = vec3(0.80, 0.93, 1.00);
                        c2 = vec3(0.83, 1.00, 0.94);
                        c3 = vec3(1.00, 0.91, 0.92);
                    } else if (paletteId == 1) {
                        c0 = vec3(1.00, 0.94, 0.89);
                        c1 = vec3(1.00, 0.84, 0.82);
                        c2 = vec3(1.00, 0.91, 0.76);
                        c3 = vec3(0.98, 0.83, 0.95);
                    } else if (paletteId == 2) {
                        c0 = vec3(0.90, 1.00, 0.95);
                        c1 = vec3(0.83, 0.99, 0.91);
                        c2 = vec3(0.86, 0.95, 1.00);
                        c3 = vec3(0.96, 1.00, 0.88);
                    } else if (paletteId == 3) {
                        c0 = vec3(0.92, 0.97, 1.00);
                        c1 = vec3(0.78, 0.89, 1.00);
                        c2 = vec3(0.90, 0.96, 1.00);
                        c3 = vec3(0.98, 1.00, 1.00);
                    } else {
                        c0 = vec3(0.95, 0.92, 1.00);
                        c1 = vec3(0.88, 0.86, 1.00);
                        c2 = vec3(0.93, 0.91, 0.98);
                        c3 = vec3(1.00, 0.88, 0.94);
                    }

                    float x = a * 3.0;
                    if (x < 1.0) return mix(c0, c1, x);
                    if (x < 2.0) return mix(c1, c2, x - 1.0);
                    return mix(c2, c3, x - 2.0);
                }

                vec3 toneMap(vec3 c, float exposure) {
                    c = vec3(1.0) - exp(-c * exposure);
                    return pow(c, vec3(0.95));
                }

                void main() {
                    vec2 uv = (gl_FragCoord.xy / uResolution.xy) * 2.0 - 1.0;
                    uv.x *= uResolution.x / uResolution.y;
                    vec2 c = uCenter + uv * uScale;

                    vec2 z = vec2(0.0);
                    float esc2 = uEscapeRadius * uEscapeRadius;
                    float smoothIter = 0.0;
                    int i;

                    for (i = 0; i < 2000; i++) {
                        if (i >= uMaxIterations) {
                            break;
                        }

                        float x = z.x * z.x - z.y * z.y + c.x;
                        float y = 2.0 * z.x * z.y + c.y;
                        z = vec2(x, y);

                        float m2 = dot(z, z);
                        if (m2 > esc2) {
                            float m = sqrt(m2);
                            float logZn = log(m);
                            float nu = log(logZn / log(2.0)) / log(2.0);
                            smoothIter = float(i) + 1.0 - nu;
                            break;
                        }
                    }

                    if (i >= uMaxIterations) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    float t = smoothIter / float(uMaxIterations);
                    float cycle = (uPaletteShift + log(max(1e-12, 1.0 / uScale)) * 0.15915494);
                    float paletteT = t * uPaletteDensity + cycle;
                    vec3 pale = paletteColor(paletteT, uPaletteId);

                    float shade = pow(clamp(t, 0.0, 1.0), 1.1);
                    vec3 color = mix(vec3(0.0), pale, shade);
                    color *= 0.78 + 0.22 * sin(6.28318 * (paletteT + 0.17));

                    gl_FragColor = vec4(toneMap(max(color, 0.0), uExposure), 1.0);
                }
            `
        });

        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(quad);

        let renderWidth = 1;
        let renderHeight = 1;
        let dragging = false;
        const dragStart = new THREE.Vector2();
        const centerStart = new THREE.Vector2();
        const clock = new THREE.Clock();

        function updateRenderSize() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const scale = Math.min(1, vw / MAX_RENDER_W, vh / MAX_RENDER_H);

            renderWidth = Math.max(320, Math.floor(MAX_RENDER_W * scale));
            renderHeight = Math.max(240, Math.floor(MAX_RENDER_H * scale));

            renderer.setSize(renderWidth, renderHeight, false);
            renderer.domElement.style.width = `${renderWidth}px`;
            renderer.domElement.style.height = `${renderHeight}px`;
            uniforms.uResolution.value.set(renderWidth, renderHeight);
        }

        function syncUniforms() {
            uniforms.uCenter.value.set(params.centerX, params.centerY);
            uniforms.uScale.value = params.scale;
            uniforms.uMaxIterations.value = params.maxIterations;
            uniforms.uEscapeRadius.value = params.escapeRadius;
            uniforms.uPaletteId.value = paletteIds[params.palette];
            uniforms.uPaletteDensity.value = params.paletteDensity;
            uniforms.uExposure.value = params.exposure;
        }

        function syncDisplay() {
            centerFolder.controllers.forEach((controller) => controller.updateDisplay());
            viewFolder.controllers.forEach((controller) => controller.updateDisplay());
            colorFolder.controllers.forEach((controller) => controller.updateDisplay());
        }

        function zoomAtPoint(clientX, clientY, zoomFactor) {
            const rect = renderer.domElement.getBoundingClientRect();
            const nx = (clientX - rect.left) / rect.width;
            const ny = (clientY - rect.top) / rect.height;
            const aspect = renderWidth / renderHeight;

            const beforeX = params.centerX + (nx * 2.0 - 1.0) * params.scale * aspect;
            const beforeY = params.centerY + (1.0 - ny * 2.0) * params.scale;

            params.scale *= zoomFactor;
            params.scale = THREE.MathUtils.clamp(params.scale, 1e-16, 4.0);

            const afterX = params.centerX + (nx * 2.0 - 1.0) * params.scale * aspect;
            const afterY = params.centerY + (1.0 - ny * 2.0) * params.scale;

            params.centerX += beforeX - afterX;
            params.centerY += beforeY - afterY;

            syncUniforms();
            syncDisplay();
        }

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault();
            const wheel = Math.sign(event.deltaY);
            const zoomFactor = wheel > 0 ? 1.06 : 0.94;
            zoomAtPoint(event.clientX, event.clientY, zoomFactor);
        }, { passive: false });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            dragging = true;
            dragStart.set(event.clientX, event.clientY);
            centerStart.set(params.centerX, params.centerY);
            renderer.domElement.setPointerCapture(event.pointerId);
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (!dragging) {
                return;
            }

            const rect = renderer.domElement.getBoundingClientRect();
            const aspect = renderWidth / renderHeight;
            const speed = event.shiftKey ? 1.8 : 1.0;
            const dx = (event.clientX - dragStart.x) / rect.width;
            const dy = (event.clientY - dragStart.y) / rect.height;

            params.centerX = centerStart.x - dx * 2.0 * params.scale * aspect * speed;
            params.centerY = centerStart.y + dy * 2.0 * params.scale * speed;

            syncUniforms();
            syncDisplay();
        });

        renderer.domElement.addEventListener('pointerup', () => {
            dragging = false;
        });

        renderer.domElement.addEventListener('pointercancel', () => {
            dragging = false;
        });

        const gui = new GUI({ title: 'Mandelbrot Controls', width: 330 });
        const viewFolder = gui.addFolder('Zoom');
        const centerFolder = gui.addFolder('Center');
        const colorFolder = gui.addFolder('Color');

        viewFolder.add(params, 'autoplay').name('Autoplay Zoom');
        viewFolder.add(params, 'zoomSpeed', 0.0, 3.0, 0.01).name('Zoom Speed');
        viewFolder.add(params, 'scale', 1e-16, 4.0, 0.0).name('Scale').onChange(syncUniforms);
        viewFolder.add(params, 'maxIterations', 32, 1400, 1).name('Iterations').onChange(syncUniforms);
        viewFolder.add(params, 'escapeRadius', 4.0, 256.0, 1.0).name('Escape Radius').onChange(syncUniforms);
        viewFolder.add(params, 'resetView').name('Reset View');

        centerFolder.add(params, 'centerX', -2.5, 1.5, 0.0000000001).name('Center X').onChange(syncUniforms);
        centerFolder.add(params, 'centerY', -1.5, 1.5, 0.0000000001).name('Center Y').onChange(syncUniforms);

        colorFolder.add(params, 'palette', Object.keys(paletteIds)).name('Palette').onChange(syncUniforms);
        colorFolder.add(params, 'paletteDensity', 0.2, 9.0, 0.01).name('Palette Density').onChange(syncUniforms);
        colorFolder.add(params, 'paletteCycle', -4.0, 4.0, 0.01).name('Cycle Speed');
        colorFolder.add(params, 'exposure', 0.3, 2.3, 0.01).name('Exposure').onChange(syncUniforms);

        viewFolder.open();
        centerFolder.open();

        function animate() {
            const delta = clock.getDelta();

            if (params.autoplay && params.zoomSpeed > 0) {
                const zoomPerSecond = Math.exp(params.zoomSpeed * 0.65);
                params.scale /= Math.pow(zoomPerSecond, delta);
                params.scale = Math.max(params.scale, 1e-16);
            }

            uniforms.uPaletteShift.value += delta * params.paletteCycle;
            syncUniforms();
            renderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        toggleHudButton.addEventListener('click', () => {
            const visible = hud.style.display !== 'none';
            hud.style.display = visible ? 'none' : 'block';
            toggleHudButton.textContent = visible ? 'Show HUD' : 'Hide HUD';
        });

        window.addEventListener('resize', updateRenderSize);

        updateRenderSize();
        syncUniforms();
        animate();
    </script>
</body>
</html>
