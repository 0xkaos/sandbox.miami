<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Raymarched sinusoidal terrain with multi-octave noise, rotate2D warping, and arrow-key directional navigation.">
    <title>Terrain Raymarch</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Space Grotesk", "Segoe UI", sans-serif; background: #04050a; color: #edf2ff; }
        canvas { width: 100vw; height: 100vh; display: block; }

        .hud {
            position: fixed; top: 14px; left: 14px; z-index: 10;
            width: min(340px, calc(100vw - 28px));
            border: 1px solid rgba(255,255,255,0.14); border-radius: 16px;
            background: rgba(8,10,18,0.82); backdrop-filter: blur(10px);
            padding: 14px 16px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.35);
            pointer-events: none;
        }
        .hud h1 { font-size: 1rem; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
        .hud p  { margin: 8px 0 0; font-size: .8rem; line-height: 1.45; color: rgba(237,242,255,0.82); }
        .hud small { display: block; margin-top: 10px; font-size: .7rem; letter-spacing: .06em; color: rgba(237,242,255,0.58); }

        .toggle {
            position: fixed; right: 14px; top: 14px; z-index: 12;
            border: 1px solid rgba(255,255,255,0.16); border-radius: 999px;
            background: rgba(8,10,18,0.7); color: #eaf1ff;
            padding: 8px 14px; font-size: .78rem; letter-spacing: .07em;
            text-transform: uppercase; cursor: pointer; backdrop-filter: blur(8px);
        }
        .toggle:hover { background: rgba(18,22,34,0.92); }

        @media (max-width: 760px) {
            .hud { width: calc(100vw - 24px); left: 12px; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 16px; padding: 12px 14px; }
            .toggle { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <aside class="hud" id="hud">
        <h1>Terrain Raymarch</h1>
        <p>Raymarched sinusoidal terrain with multi-octave noise and rotate2D warping. Fly through with arrow keys.</p>
        <small>Arrows: move &nbsp;|&nbsp; Ctrl+Arrows: look &nbsp;|&nbsp; Click: mouse look &nbsp;|&nbsp; Esc: release</small>
    </aside>
    <button class="toggle" id="toggle-hud" type="button">Hide HUD</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        /* ── DOM ── */
        const app = document.getElementById('app');
        const hud = document.getElementById('hud');
        const toggleBtn = document.getElementById('toggle-hud');
        let hudVisible = true;
        toggleBtn.addEventListener('click', () => {
            hudVisible = !hudVisible;
            hud.style.display = hudVisible ? '' : 'none';
            toggleBtn.textContent = hudVisible ? 'Hide HUD' : 'Show HUD';
        });

        /* ── Renderer / Camera ── */
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        app.appendChild(renderer.domElement);

        const scene  = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        /* ── Uniforms ── */
        const uniforms = {
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uTime:       { value: 0 },
            uCamPos:     { value: new THREE.Vector3(2.0, 1.5, 0.0) },
            uYaw:        { value: 0.0 },
            uPitch:      { value: -0.35 },
        };

        /* ── Shaders ── */
        const vertexShader = /* glsl */ `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = /* glsl */ `
            precision highp float;

            uniform vec2  uResolution;
            uniform float uTime;
            uniform vec3  uCamPos;
            uniform float uYaw;
            uniform float uPitch;

            /* ── rotate2D helper ── */
            mat2 rotate2D(float angle) {
                float c = cos(angle), s = sin(angle);
                return mat2(c, -s, s, c);
            }

            void main() {
                vec2 r  = uResolution;
                vec2 FC = gl_FragCoord.xy;
                float t = uTime;

                // Build ray from screen UV + camera angles
                vec2 uv = (FC.xy - 0.5 * r) / r.y;
                vec3 rd = normalize(vec3(uv, 1.0));
                rd.yz *= rotate2D(uPitch);
                rd.xz *= rotate2D(uYaw);

                vec3 ro = uCamPos;

                vec4 o = vec4(0.0);

                for (float e, i = 0.0, a, w, x, g = 0.0, h; i++ < 90.0;
                     o += 0.01 - 0.02 / exp(max(0.0, e) * 3000.0) / h) {

                    vec3 p = ro + rd * g;

                    e = p.y;
                    h = e + p.x * 0.3;

                    // Multi-octave sinusoidal terrain
                    for (a = 0.6; a > 0.001; a *= 0.7) {
                        p.xz *= rotate2D(5.0);
                        x = (p.x + p.z) / a + t + t;
                        e -= w = exp(sin(x) - 3.0) * a;
                        h += abs(dot(sin(p.xz / a * 0.3) * a, r / r));
                    }

                    g += e = min(e, h * 0.5 - 1.0);
                }

                gl_FragColor = o;
            }
        `;

        /* ── Fullscreen quad ── */
        const quad = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader })
        );
        scene.add(quad);

        /* ── Camera state ── */
        const cam = {
            pos: new THREE.Vector3(2.0, 1.5, 0.0),
            yaw: 0,
            pitch: -0.35,
        };

        const NAV_SPEED   = 2.0;
        const LOOK_SPEED  = 1.2;
        const MOUSE_SENS  = 0.002;
        const MIN_CLEAR   = 0.35;   // minimum clearance above terrain

        /* ── JS-side terrain height (mirrors shader octaves) ── */
        function terrainHeight(px, pz, t) {
            let height = 0;
            for (let a = 0.6; a > 0.001; a *= 0.7) {
                const c = Math.cos(5.0), s = Math.sin(5.0);
                const nx = c * px - s * pz;
                const nz = s * px + c * pz;
                px = nx; pz = nz;
                const x = (px + pz) / a + t + t;
                height += Math.exp(Math.sin(x) - 3.0) * a;
            }
            return height;
        }

        /* ── Input ── */
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            keys['ctrl'] = e.ctrlKey;
            if (e.code.startsWith('Arrow')) e.preventDefault();
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            keys['ctrl'] = e.ctrlKey;
        });

        /* ── Pointer-lock mouse look ── */
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === renderer.domElement) {
                cam.yaw   -= e.movementX * MOUSE_SENS;
                cam.pitch -= e.movementY * MOUSE_SENS;
                cam.pitch  = Math.max(-1.3, Math.min(0.8, cam.pitch));
            }
        });

        /* ── Navigation update ── */
        function updateNav(dt) {
            const t = uniforms.uTime.value;

            if (keys['ctrl']) {
                // Ctrl + Arrow = angle adjustment
                if (keys['ArrowLeft'])  cam.yaw   += LOOK_SPEED * dt;
                if (keys['ArrowRight']) cam.yaw   -= LOOK_SPEED * dt;
                if (keys['ArrowUp'])    cam.pitch += LOOK_SPEED * dt;
                if (keys['ArrowDown'])  cam.pitch -= LOOK_SPEED * dt;
            } else {
                // Arrow = directional movement in camera-relative XZ
                const fwdX = -Math.sin(cam.yaw);
                const fwdZ =  Math.cos(cam.yaw);
                const rgtX =  fwdZ;
                const rgtZ = -fwdX;

                if (keys['ArrowUp']) {
                    cam.pos.x += fwdX * NAV_SPEED * dt;
                    cam.pos.z += fwdZ * NAV_SPEED * dt;
                }
                if (keys['ArrowDown']) {
                    cam.pos.x -= fwdX * NAV_SPEED * dt;
                    cam.pos.z -= fwdZ * NAV_SPEED * dt;
                }
                if (keys['ArrowLeft']) {
                    cam.pos.x -= rgtX * NAV_SPEED * dt;
                    cam.pos.z -= rgtZ * NAV_SPEED * dt;
                }
                if (keys['ArrowRight']) {
                    cam.pos.x += rgtX * NAV_SPEED * dt;
                    cam.pos.z += rgtZ * NAV_SPEED * dt;
                }
            }

            // Clamp pitch
            cam.pitch = Math.max(-1.3, Math.min(0.8, cam.pitch));

            // Collision: keep camera above terrain surface
            const th = terrainHeight(cam.pos.x, cam.pos.z, t);
            const floor = th + MIN_CLEAR;
            if (cam.pos.y < floor) {
                cam.pos.y += (floor - cam.pos.y) * Math.min(1.0, 8.0 * dt); // smooth push-up
            } else {
                // Gently settle toward hover height so camera doesn't float forever
                const hover = th + 0.9;
                cam.pos.y += (hover - cam.pos.y) * Math.min(1.0, 1.5 * dt);
            }

            // Push to uniforms
            uniforms.uCamPos.value.copy(cam.pos);
            uniforms.uYaw.value   = cam.yaw;
            uniforms.uPitch.value = cam.pitch;
        }

        /* ── Resize ── */
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });

        /* ── Render loop ── */
        const clock = new THREE.Clock();
        (function tick() {
            requestAnimationFrame(tick);
            const dt = Math.min(clock.getDelta(), 0.05); // cap large dt
            uniforms.uTime.value = clock.getElapsedTime() * 0.4;
            updateNav(dt);
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
