<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Real-time GPU particle simulation of quasiperiodic Hamiltonian chaos and Arnold web transport in a driven acoustic cavity analogue." />
  <title>Hamiltonian Arnold Web</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <section class="hud" aria-label="simulation status">
    <div class="hud-title">Hamiltonian Arnold Web</div>
    <div class="hud-row">
      <span>particles</span>
      <strong id="particleReadout">200k</strong>
    </div>
    <div class="hud-row">
      <span>fps</span>
      <strong id="fpsReadout">--</strong>
    </div>
    <div class="hud-row">
      <span>gpu</span>
      <strong id="gpuReadout">checking</strong>
    </div>
    <div class="status-line" id="statusLine">initializing float render targets</div>
  </section>

  <div class="error-panel" id="errorPanel" hidden>
    <h1>WebGL2 float simulation unavailable</h1>
    <p id="errorCopy"></p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
